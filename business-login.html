<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Business Login | WorkBridge Africa
</title>

<meta
name="description"
content="Login to your WorkBridge Africa business account.">

<link
rel="stylesheet"
href="business-login.css">

<script
defer
src="business-login.js">
</script>

</head>

<body>

<header class="site-header">

<a
href="index.html"
class="logo">
🌍 WorkBridge Africa
</a>

<a
href="business-signup.html"
class="login-link">
Create Account
</a>

</header>

<main class="login-page">

<section class="login-wrapper">

<div class="login-info">

<h1>
Welcome Back
</h1>

<p>
Login to manage your business profile, publish jobs and track applicants.
</p>

<ul>

<li>✓ Secure business login</li>

<li>✓ Manage job postings</li>

<li>✓ View applications</li>

</ul>

</div>

<div class="login-card">

<h2>
Business Login
</h2>

<form
id="businessLoginForm">

<div class="field">

<label>
Email
</label>

<input
type="email"
id="email"
placeholder="Business email"
required>

</div>

<div class="field">

<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<button
type="submit"
id="loginButton">

Login

</button>

<p
id="loginMessage">
</p>

</form>

<div class="login-links">

<a
href="forgot-password.html">

Forgot Password?

</a>

</div>

</div>

</section>

</main>

<footer>

<p>

©
<span id="year"></span>
WorkBridge Africa

</p>

</footer>

</body>

  </html>
